# Spring Application Name
spring.application.name=bodymatch

# Spring DataSource Configuration
# Development
spring.datasource.url=jdbc:postgresql://localhost:5432/bodymatch
spring.datasource.username=postgres
spring.datasource.password=1234



spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Data JPA Configuration
spring.jpa.database=postgresql
spring.jpa.show-sql=true

# Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=pe.edu.upc.bodymatch.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Servlet Multipart (for video / image uploads)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# Server Configuration
server.port=8091
server.error.include-message=always

# Swagger / OpenAPI Configuration
# UI:    http://localhost:8091/swagger-ui/index.html
# JSON:  http://localhost:8091/v3/api-docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.persist-authorization=true
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json
springdoc.packagesToScan=pe.edu.upc.bodymatch
springdoc.show-actuator=false

# JWT Configuration Properties
authorization.jwt.secret=${JWT_SECRET:SecretStringForTokensSignInCredentialsBodyMatchAI}
authorization.jwt.access.expiration.minutes=${JWT_ACCESS_EXPIRATION_MINUTES:60}
authorization.jwt.refresh.expiration.days=${JWT_REFRESH_EXPIRATION_DAYS:30}

# Stripe API
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:8091/api/v1/subscriptions/success}
stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:8091/api/v1/subscriptions/cancel}

# Gemini API
gemini.api-key=${GEMINI_API_KEY:}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.model.exercise=${GEMINI_MODEL_EXERCISE:gemini-2.5-flash}
gemini.model.nutrition=${GEMINI_MODEL_NUTRITION:gemini-2.5-flash}
gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:60}

# Cloud Storage (Google Cloud Storage compatible)
cloud-storage.provider=${CLOUD_STORAGE_PROVIDER:local}
cloud-storage.bucket=${CLOUD_STORAGE_BUCKET:bodymatch-videos}
cloud-storage.base-url=${CLOUD_STORAGE_BASE_URL:http://localhost:8091/storage}
cloud-storage.local-path=${CLOUD_STORAGE_LOCAL_PATH:./storage}
cloud-storage.credentials-path=${CLOUD_STORAGE_CREDENTIALS_PATH:}

# Logging
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=INFO
logging.level.pe.edu.upc.bodymatch=DEBUG
